
# ==========================================
# LAUNCHCONTROL - CONFIGURACAO DA APLICACAO
# ==========================================

spring.application.name=LaunchControl

# Porta definida automaticamente pela hospedagem
server.port=${PORT:8080}

# ==========================================
# BANCO DE DADOS MYSQL
# ==========================================

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/launchcontrol?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Sao_Paulo&characterEncoding=UTF-8}

spring.datasource.username=${DB_USER:root}

# Senha fornecida por variavel de ambiente
spring.datasource.password=${DB_PASSWORD}

# ==========================================
# JPA / HIBERNATE
# ==========================================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

spring.sql.init.mode=never

# ==========================================
# DATA E HORA
# ==========================================

spring.jackson.time-zone=America/Sao_Paulo

# ==========================================
# TRATAMENTO DE ERROS
# ==========================================

server.error.include-message=never

# ==========================================
# CONTAS DE DEMONSTRACAO
# ==========================================

launchcontrol.demo-accounts=${DEMO_ACCOUNTS:false}

# ==========================================
# RECUPERACAO DE SENHA POR EMAIL
# ==========================================

spring.mail.host=smtp.gmail.com
spring.mail.port=587

spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# ==========================================
# ENDERECO DO FRONTEND
# ==========================================

app.frontend-url=${FRONTEND_URL:http://localhost:8080}
